# CI backstop: deep code review — fires ONLY when the `deep-review` label is applied.
#
# HOW IT WORKS
# The `/publish` triage router (Step 5.6) applies the `deep-review` label automatically
# when a diff is large (>400 lines / >10 files) or touches sensitive paths (auth, crypto,
# migrations, IaC, workflows). This workflow picks that up and runs the full swarm review
# asynchronously, posting its findings as a PR comment.
#
# SETUP PER REPO
# 1. Copy this file to .github/workflows/deep-review.yml in your repo.
# 2. Create the `deep-review` label in the repo (Settings → Labels → New label).
# 3. Ensure ANTHROPIC_API_KEY (or your runner's Claude auth) is set as a repo secret.
# 4. Remove (or gate) any existing per-PR review workflow that fires unconditionally.

name: Deep code review (backstop)

on:
  pull_request:
    types: [labeled]

jobs:
  deep-review:
    # Only run when the specific label is applied — not for any other label event.
    if: github.event.label.name == 'deep-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git blame and git log work

      - name: Set up Node.js (for Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run deep review via /code-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --print "/code-review ${{ github.event.pull_request.number }}"
        # /code-review is the full 5-agent swarm from the code-review plugin.
        # It posts its own comment to the PR; this step just triggers it.
